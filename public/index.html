<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Operation: Shadow Island</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-wrapper">
    <!-- Title Screen -->
    <div id="title-screen" class="screen">
      <div class="title-content">
        <h1 class="game-title">OPERATION</h1>
        <h2 class="game-subtitle">SHADOW ISLAND</h2>
        <div class="pixel-divider"></div>
        <p class="tagline">Infiltrate. Eliminate. Escape.</p>
        <button id="btn-start" class="pixel-btn">START MISSION</button>
        <button id="btn-leaderboard" class="pixel-btn secondary">LEADERBOARD</button>
      </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Mobile Controls -->
    <div id="mobile-controls" class="hidden">
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-thumb"></div>
        </div>
      </div>
      <button id="btn-attack" class="action-btn">ATK</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen hidden">
      <div class="screen-content">
        <h2 class="screen-title red">MISSION FAILED</h2>
        <p id="gameover-text">You were eliminated.</p>
        <button id="btn-retry" class="pixel-btn">RETRY</button>
        <button id="btn-menu" class="pixel-btn secondary">MENU</button>
      </div>
    </div>

    <!-- Victory Screen -->
    <div id="victory-screen" class="screen hidden">
      <div class="screen-content">
        <h2 class="screen-title green">MISSION COMPLETE</h2>
        <p id="victory-score">Score: 0</p>
        <p id="victory-time">Time: 00:00</p>
        <button id="btn-leaderboard2" class="pixel-btn">LEADERBOARD</button>
        <button id="btn-menu2" class="pixel-btn secondary">MENU</button>
      </div>
    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboard-modal" class="screen hidden">
      <div class="screen-content wide">
        <h2 class="screen-title">TOP AGENTS</h2>
        <div id="leaderboard-list"></div>
        <button id="btn-close-lb" class="pixel-btn secondary">CLOSE</button>
      </div>
    </div>
  </div>

  <!-- Game Scripts -->
  <script src="js/telegram.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/input.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
