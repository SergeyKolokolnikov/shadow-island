<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Operation: Shadow Island</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-wrapper">
    <!-- Title Screen -->
    <div id="title-screen" class="screen">
      <div class="title-content">
        <h1 class="game-title" data-i18n="title_operation">OPERATION</h1>
        <h2 class="game-subtitle" data-i18n="title_shadow_island">SHADOW ISLAND</h2>
        <div class="pixel-divider"></div>
        <p class="tagline" data-i18n="title_tagline">Infiltrate. Eliminate. Escape.</p>
        <button id="btn-start" class="pixel-btn" data-i18n="btn_start">START MISSION</button>
        <button id="btn-leaderboard" class="pixel-btn secondary" data-i18n="btn_leaderboard">LEADERBOARD</button>
      </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Mobile Controls -->
    <div id="mobile-controls" class="hidden">
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-thumb"></div>
        </div>
      </div>
      <div id="kick-zone">
        <div id="kick-base">
          <div id="kick-thumb"></div>
          <span id="kick-label" data-i18n="kick_label">KICK</span>
        </div>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen hidden">
      <div class="screen-content">
        <h2 class="screen-title red" data-i18n="mission_failed">MISSION FAILED</h2>
        <p id="gameover-text" data-i18n="you_were_eliminated">You were eliminated.</p>
        <button id="btn-retry" class="pixel-btn" data-i18n="btn_retry">RETRY</button>
        <button id="btn-menu" class="pixel-btn secondary" data-i18n="btn_menu">MENU</button>
      </div>
    </div>

    <!-- Victory Screen -->
    <div id="victory-screen" class="screen hidden">
      <div class="screen-content">
        <h2 class="screen-title green" data-i18n="mission_complete">MISSION COMPLETE</h2>
        <p id="victory-score">Score: 0</p>
        <p id="victory-time">Time: 00:00</p>
        <button id="btn-leaderboard2" class="pixel-btn" data-i18n="btn_leaderboard">LEADERBOARD</button>
        <button id="btn-menu2" class="pixel-btn secondary" data-i18n="btn_menu">MENU</button>
      </div>
    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboard-modal" class="screen hidden">
      <div class="screen-content wide">
        <h2 class="screen-title" data-i18n="top_agents">TOP AGENTS</h2>
        <div id="leaderboard-list"></div>
        <button id="btn-close-lb" class="pixel-btn secondary" data-i18n="btn_close">CLOSE</button>
      </div>
    </div>
  </div>

  <!-- Game Scripts -->
  <script src="js/i18n.js"></script>
  <script src="js/telegram.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/input.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
